services:
  postgres:
    image: postgres:15-alpine
    container_name: blackjack-db
    environment:
      POSTGRES_USER: blackjack
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blackjack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackjack"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackjack-backend
    environment:
      DATABASE_URL: postgresql://blackjack:password@postgres:5432/blackjack?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npm run start:prod"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blackjack-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/game
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
